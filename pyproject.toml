[project]
name = "vllama"
version = "0.1.0"
description = "Ollama-like CLI and TUI for vLLM backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "textual>=0.86",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vllama = "vllama.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllama"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
